name: Deployment for DockerCompose app 
on: 
  push: 
    branches: 
    - deploy
jobs: 
  deployment-job: 
    runs-on: self-hosted
    steps: 
      - name: Say helloCKERHUB_USERNAME
        run: echo "Hello"
        
      - name: checkout of repo
        uses: actions/checkout@v6 
      
      - name: build the docker image
        run: sudo docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/discussions:latest .

      - name: login to Docker hub
        run: sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: push the docker image
        run: sudo docker push ${{ secrets.DOCKERHUB_USERNAME }}/discussions:latest

      - name: deploy to live within runner
        run: |
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/discussions:latest
          sudo docker run -d -p 80:80 --name discussions ${{ secrets.DOCKERHUB_USERNAME }}/discussions:latest

